<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-labelledby="t">
  <title id="t">Map of Camp Pinewood with a compass arrow and a key for the cabin, dining hall, dock and fire ring</title>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker>
  </defs>
  <!-- camp ground -->
  <rect x="16" y="16" width="288" height="288" fill="#F3F7EC" stroke="#111" stroke-width="3"/>
  <!-- lake along the west side -->
  <path d="M16 16 H96 Q120 80 100 150 Q84 220 112 304 H16 Z" fill="#CFE3F5" stroke="#123E9C" stroke-width="3"/>
  <!-- dock: a thick line from the shore into the lake -->
  <path d="M104 158 H64" stroke="#111" stroke-width="9"/>
  <!-- cabins (triangles) -->
  <g fill="#111"><polygon points="226,52 246,86 206,86"/><polygon points="226,222 246,256 206,256"/></g>
  <!-- dining hall (square) due east of the dock -->
  <rect x="214" y="144" width="28" height="28" fill="#FFFFFF" stroke="#111" stroke-width="4"/>
  <!-- fire ring (circle) -->
  <circle cx="150" cy="260" r="12" fill="#FFFFFF" stroke="#111" stroke-width="4"/>
  <!-- north arrow -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111"><text x="268" y="52" font-weight="bold" text-anchor="middle">N</text></g>
  <path d="M268 94 V60" stroke="#111" stroke-width="3" marker-end="url(#n)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="60" y="52" text-anchor="middle" font-weight="bold">Lake</text>
  </g>
  <!-- key -->
  <rect x="16" y="318" width="288" height="112" fill="#FFFFFF" stroke="#444" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <polygon points="38,328 52,352 24,352" fill="#111"/><text x="64" y="350">cabin</text>
    <rect x="164" y="330" width="22" height="22" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="196" y="350">dining hall</text>
    <path d="M24 378 H52" stroke="#111" stroke-width="8"/><text x="64" y="386">dock</text>
    <circle cx="175" cy="378" r="10" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="196" y="386">fire ring</text>
    <rect x="24" y="398" width="28" height="18" fill="#CFE3F5" stroke="#123E9C" stroke-width="2"/><text x="64" y="416">lake</text>
  </g>
</svg>
