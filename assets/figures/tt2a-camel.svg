<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-labelledby="t">
  <title id="t">Diagram of a camel with three labels: hump, long eyelashes, and wide, flat feet</title>
  <path d="M0 240 Q80 228 150 240 T300 238" fill="#F3E3C3" stroke="#8A6A3A" stroke-width="2.5"/>
  <g fill="#D9B68A" stroke="#4A2E16" stroke-width="3" stroke-linejoin="round">
    <!-- legs -->
    <path d="M92 168 L88 230 L100 230 L106 170 Z"/><path d="M122 172 L122 230 L134 230 L136 172 Z"/>
    <path d="M190 172 L192 230 L204 230 L206 170 Z"/><path d="M214 166 L220 230 L232 230 L228 164 Z"/>
    <!-- body with one hump -->
    <path d="M80 160 Q74 110 120 104 Q140 50 178 92 Q214 98 226 128 Q238 170 210 176 Q150 186 96 178 Q80 174 80 160 Z"/>
    <!-- neck and head -->
    <path d="M216 126 Q238 120 246 92 Q250 66 262 58 Q284 52 292 66 Q294 78 280 80 Q266 84 262 100 Q256 136 226 150 Z"/>
  </g>
  <!-- wide feet -->
  <g fill="#C79C70" stroke="#4A2E16" stroke-width="3"><ellipse cx="94" cy="232" rx="14" ry="6"/><ellipse cx="128" cy="232" rx="14" ry="6"/><ellipse cx="198" cy="232" rx="14" ry="6"/><ellipse cx="226" cy="232" rx="14" ry="6"/></g>
  <path d="M80 150 Q64 160 66 186" fill="none" stroke="#4A2E16" stroke-width="3"/>
  <circle cx="272" cy="64" r="3.5" fill="#111"/>
  <g stroke="#111" stroke-width="2"><path d="M268 60 l-3 -6 M272 59 l0 -7 M276 60 l3 -6"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="14" y="60">hump</text><path d="M72 62 L140 74" stroke="#111" stroke-width="2"/>
    <text x="128" y="24">long eyelashes</text><path d="M240 30 L268 52" stroke="#111" stroke-width="2"/>
    <text x="40" y="280">wide, flat feet</text><path d="M150 266 L196 240" stroke="#111" stroke-width="2"/><path d="M110 262 L118 240" stroke="#111" stroke-width="2"/>
  </g>
</svg>
