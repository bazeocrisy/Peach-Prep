<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-labelledby="t">
  <title id="t">A web page with tabs, a search box, the heading From Egg to Wing, a sentence with one dotted word, an open pop-up box, and an underlined link.</title>
  <!-- screen frame -->
  <rect x="2" y="2" width="316" height="436" rx="12" fill="#FFFFFF" stroke="#444" stroke-width="3"/>
  <path d="M2 34 H318" stroke="#444" stroke-width="2"/>
  <rect x="3.5" y="3.5" width="313" height="29" rx="10" fill="#E6E6E6"/>
  <g fill="#FFFFFF" stroke="#444" stroke-width="1.5"><circle cx="20" cy="18" r="6"/><circle cx="38" cy="18" r="6"/><circle cx="56" cy="18" r="6"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <!-- tabs -->
    <rect x="12" y="46" width="78" height="34" rx="6" fill="#F4F4F4" stroke="#444" stroke-width="2"/>
    <text x="51" y="71" text-anchor="middle">Home</text>
    <rect x="96" y="46" width="128" height="34" rx="6" fill="#FFF0B8" stroke="#111" stroke-width="3.5"/>
    <text x="160" y="71" text-anchor="middle" font-weight="bold">Butterflies</text>
    <rect x="230" y="46" width="78" height="34" rx="6" fill="#F4F4F4" stroke="#444" stroke-width="2"/>
    <text x="269" y="71" text-anchor="middle">Bees</text>
    <!-- search box -->
    <rect x="12" y="94" width="296" height="36" rx="18" fill="#FFFFFF" stroke="#444" stroke-width="2"/>
    <circle cx="34" cy="110" r="8" fill="none" stroke="#444" stroke-width="3"/><path d="M40 116 L48 124" stroke="#444" stroke-width="3.5"/>
    <text x="58" y="120" fill="#555">Search</text>
    <!-- heading -->
    <text x="12" y="172" font-size="24" font-weight="bold">From Egg to Wing</text>
    <!-- words with one dotted word -->
    <text x="12" y="212">A tiny caterpillar</text>
    <text x="12" y="240">hatches from its egg.</text>
    <path d="M12 246 H86" stroke="#111" stroke-width="2.5" stroke-dasharray="4 4"/>
    <!-- open pop-up box pointing at the dotted word -->
    <path d="M40 262 L50 252 L60 262" fill="#FFF8E0" stroke="#111" stroke-width="2"/>
    <rect x="12" y="262" width="296" height="66" rx="8" fill="#FFF8E0" stroke="#111" stroke-width="2"/>
    <path d="M41 262 H59" stroke="#FFF8E0" stroke-width="3"/>
    <text x="24" y="290"><tspan font-weight="bold">hatches:</tspan> comes out</text>
    <text x="24" y="318">of an egg</text>
    <text x="288" y="288" font-weight="bold">x</text>
    <!-- more words -->
    <text x="12" y="366">Then it eats and eats.</text>
    <!-- link -->
    <text x="12" y="410" fill="#123E9C" text-decoration="underline">Next page: Monarch gardens</text>
  </g>
</svg>
