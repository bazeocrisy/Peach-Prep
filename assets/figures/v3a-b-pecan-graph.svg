<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="t">
  <title id="t">Bar graph titled Pecans We Picked in November. The bottom says buckets of pecans. Week 1: 3, week 2: 6, week 3: 8, week 4: 4.</title>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="160" y="26" font-size="22" font-weight="bold" text-anchor="middle">Pecans We Picked</text>
    <text x="160" y="52" font-size="22" font-weight="bold" text-anchor="middle">in November</text>
    <g font-size="21" text-anchor="end"><text x="88" y="102">Week 1</text><text x="88" y="147">Week 2</text><text x="88" y="192">Week 3</text><text x="88" y="237">Week 4</text></g>
  </g>
  <g fill="#E7C9A0" stroke="#111" stroke-width="2.5">
