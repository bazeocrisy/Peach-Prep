    <rect x="96" y="125" width="138" height="30"/>
    <rect x="96" y="170" width="184" height="30"/>
    <rect x="96" y="215" width="92" height="30"/>
  </g>
  <path d="M96 70 V256 H304" fill="none" stroke="#111" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#111">
    <text x="171" y="102">3</text><text x="240" y="147">6</text><text x="286" y="192">8</text><text x="194" y="237">4</text>
    <text x="200" y="286" text-anchor="middle">buckets of pecans</text>
