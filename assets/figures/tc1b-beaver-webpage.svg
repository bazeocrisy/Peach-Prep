    <rect x="12" y="136" width="296" height="140" fill="#DCEBF5" stroke="#444" stroke-width="2"/>
    <path d="M12 236 Q90 226 160 232 T308 236 V276 H12 Z" fill="#9CC3DE"/>
    <path d="M30 236 L60 196 L120 192 L150 236 Z" fill="#B58B5A" stroke="#4A2E16" stroke-width="2"/>
