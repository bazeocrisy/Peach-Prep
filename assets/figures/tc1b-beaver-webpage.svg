<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="t">
  <title id="t">A web page with tabs, the heading Busy Builders, a video with a play button that shows a pile of branches in the water, a caption line under the video, and an underlined link.</title>
  <!-- screen frame -->
  <rect x="2" y="2" width="316" height="466" rx="12" fill="#FFFFFF" stroke="#444" stroke-width="3"/>
  <path d="M2 34 H318" stroke="#444" stroke-width="2"/>
  <rect x="3.5" y="3.5" width="313" height="29" rx="10" fill="#E6E6E6"/>
  <g fill="#FFFFFF" stroke="#444" stroke-width="1.5"><circle cx="20" cy="18" r="6"/><circle cx="38" cy="18" r="6"/><circle cx="56" cy="18" r="6"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
