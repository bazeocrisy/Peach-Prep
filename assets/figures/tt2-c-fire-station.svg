<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-labelledby="t">
  <title id="t">Diagram of a fire station cut open to show two floors. Top floor: bunk room and kitchen. A pole goes from the bunk room down to the engine bay. Downstairs, the bottom of the pole is next to the gear rack, and the gear rack is next to the fire truck. The truck faces the big doors, which open onto the street.</title>
  <!-- ground and street -->
  <path d="M0 270 L320 270" stroke="#333" stroke-width="3"/>
  <rect x="252" y="270" width="68" height="8" fill="#9A9A9A"/>
  <path d="M258 274 L272 274 M284 274 L298 274 M308 274 L318 274" stroke="#FFF" stroke-width="2"/>
  <!-- building -->
  <rect x="10" y="50" width="240" height="220" fill="#FFF6EC" stroke="#5A3A22" stroke-width="3"/>
  <path d="M4 50 L256 50" stroke="#5A3A22" stroke-width="6"/>
  <!-- upstairs floor with a hole for the pole -->
  <path d="M10 150 L24 150 M46 150 L250 150" stroke="#5A3A22" stroke-width="5"/>
  <path d="M140 50 L140 150" stroke="#5A3A22" stroke-width="3"/>
  <!-- beds -->
  <g fill="#DCE8F5" stroke="#2F4A66" stroke-width="2.5">
    <rect x="58" y="96" width="70" height="16" rx="3"/><rect x="58" y="128" width="70" height="16" rx="3"/>
  </g>
  <g fill="#FFFFFF" stroke="#2F4A66" stroke-width="2"><rect x="60" y="90" width="18" height="8" rx="3"/><rect x="60" y="122" width="18" height="8" rx="3"/></g>
  <!-- kitchen: table, stove -->
  <g fill="#E9D3B4" stroke="#5A3A22" stroke-width="2.5">
    <rect x="160" y="118" width="40" height="8"/><path d="M164 126 L164 146 M196 126 L196 146"/>
    <rect x="212" y="104" width="30" height="42"/>
  </g>
  <g fill="none" stroke="#5A3A22" stroke-width="2"><circle cx="220" cy="110" r="4"/><circle cx="234" cy="110" r="4"/></g>
  <!-- pole -->
  <path d="M35 64 L35 268" stroke="#777" stroke-width="5"/>
  <!-- gear rack with coats and boots -->
  <g stroke="#3A3A3A" stroke-width="2.5" fill="none"><path d="M50 196 L50 268 M84 196 L84 268 M46 196 L88 196"/></g>
  <g fill="#E8C24A" stroke="#3A3A3A" stroke-width="2"><path d="M54 200 L66 200 L68 232 L52 232 Z"/><path d="M68 200 L80 200 L82 232 L66 232 Z"/></g>
  <g fill="#333"><rect x="54" y="252" width="10" height="16"/><rect x="70" y="252" width="10" height="16"/></g>
  <!-- fire truck, front (cab) toward the doors -->
  <g stroke="#3A1010" stroke-width="2.5">
    <rect x="96" y="214" width="112" height="44" fill="#D8433B"/>
    <path d="M208 258 L208 202 L232 202 L244 226 L244 258 Z" fill="#D8433B"/>
    <path d="M214 208 L230 208 L238 226 L214 226 Z" fill="#DCE8F5"/>
    <path d="M100 206 L204 206 M100 200 L204 200" fill="none"/>
    <path d="M110 200 L110 206 M130 200 L130 206 M150 200 L150 206 M170 200 L170 206 M190 200 L190 206" fill="none"/>
  </g>
  <g fill="#222" stroke="#000" stroke-width="2"><circle cx="124" cy="260" r="10"/><circle cx="224" cy="260" r="10"/></g>
  <!-- big doors: an opening in the wall, drawn dashed -->
  <path d="M250 152 L250 270" stroke="#FFF6EC" stroke-width="5"/>
  <path d="M250 154 L250 270" stroke="#5A3A22" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#111">
    <text x="8" y="26">bunk room</text><path d="M60 32 L84 90" stroke="#111" stroke-width="2"/>
    <text x="196" y="26">kitchen</text><path d="M228 32 L226 102" stroke="#111" stroke-width="2"/>
    <text x="256" y="196">street</text>
    <text x="4" y="302">pole</text><path d="M24 284 L33 268" stroke="#111" stroke-width="2"/>
    <text x="104" y="302">fire truck</text><path d="M150 284 L160 258" stroke="#111" stroke-width="2"/>
    <text x="30" y="332">gear rack</text><path d="M68 314 L68 270" stroke="#111" stroke-width="2"/>
    <text x="210" y="332">big doors</text><path d="M252 314 L251 272" stroke="#111" stroke-width="2"/>
  </g>
</svg>
