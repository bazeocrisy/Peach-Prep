<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 448" role="img" aria-labelledby="t">
  <title id="t">Map of the Maple Street School yard with a compass arrow and a key for the bench, flagpole, garden, swings and sandbox</title>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker>
  </defs>
  <rect x="16" y="16" width="288" height="256" fill="#F3F7EC" stroke="#111" stroke-width="3"/>
  <!-- bench: a thick bar in the south middle -->
  <path d="M138 238 H182" stroke="#111" stroke-width="9"/>
  <!-- flagpole: circle straight north of the bench -->
  <circle cx="160" cy="92" r="12" fill="#FFFFFF" stroke="#111" stroke-width="4"/>
  <!-- garden: triangle north-west -->
  <polygon points="64,128 84,162 44,162" fill="#111"/>
  <!-- swings: square north-east -->
  <rect x="244" y="104" width="26" height="26" fill="#FFFFFF" stroke="#111" stroke-width="4"/>
  <!-- sandbox: diamond straight east of the bench -->
  <polygon points="262,218 280,238 262,258 244,238" fill="#111"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111"><text x="52" y="52" font-weight="bold" text-anchor="middle">N</text></g>
  <path d="M52 100 V60" stroke="#111" stroke-width="3" marker-end="url(#n)"/>
  <rect x="16" y="284" width="288" height="158" fill="#FFFFFF" stroke="#444" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <path d="M24 304 H52" stroke="#111" stroke-width="8"/><text x="66" y="311">bench</text>
    <circle cx="38" cy="328" r="10" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="66" y="336">flagpole</text>
    <polygon points="38,346 52,366 24,366" fill="#111"/><text x="66" y="364">garden</text>
    <rect x="26" y="376" width="22" height="22" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="66" y="394">swings</text>
    <polygon points="38,406 50,418 38,430 26,418" fill="#111"/><text x="66" y="425">sandbox</text>
  </g>
</svg>
