<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="t">
  <title id="t">Drawing of a peanut field with four labels: sun, peanuts, leaves and soil</title>
  <!-- sun -->
  <circle cx="270" cy="50" r="22" fill="#FFE08A" stroke="#111" stroke-width="2.5"/>
  <g stroke="#111" stroke-width="2.5"><path d="M270 16 V8"/><path d="M270 92 V84"/><path d="M236 50 H228"/><path d="M304 50 H312"/><path d="M246 26 L240 20"/><path d="M294 74 L300 80"/><path d="M294 26 L300 20"/><path d="M246 74 L240 80"/></g>
  <!-- soil -->
  <rect x="0" y="200" width="320" height="100" fill="#EADBC2"/>
  <path d="M0 200 H320" stroke="#4A3A22" stroke-width="3"/>
  <g fill="#4A3A22"><circle cx="30" cy="240" r="2"/><circle cx="120" cy="280" r="2"/><circle cx="210" cy="250" r="2"/><circle cx="290" cy="276" r="2"/></g>
  <!-- three plants lying upside down: leaves on the ground, peanuts on top -->
  <g>
    <g fill="#CFE8C4" stroke="#2F5A2A" stroke-width="2.5">
      <ellipse cx="44" cy="192" rx="22" ry="9"/><ellipse cx="82" cy="194" rx="22" ry="9"/>
      <ellipse cx="134" cy="192" rx="22" ry="9"/><ellipse cx="172" cy="194" rx="22" ry="9"/>
      <ellipse cx="224" cy="192" rx="22" ry="9"/><ellipse cx="262" cy="194" rx="22" ry="9"/>
    </g>
    <g stroke="#2F5A2A" stroke-width="3" fill="none"><path d="M63 186 V156"/><path d="M153 186 V156"/><path d="M243 186 V156"/></g>
    <g fill="#D9B27C" stroke="#4A2E16" stroke-width="2">
      <ellipse cx="52" cy="150" rx="8" ry="11"/><ellipse cx="66" cy="144" rx="8" ry="11"/><ellipse cx="78" cy="152" rx="8" ry="11"/>
      <ellipse cx="142" cy="150" rx="8" ry="11"/><ellipse cx="156" cy="144" rx="8" ry="11"/><ellipse cx="168" cy="152" rx="8" ry="11"/>
      <ellipse cx="232" cy="150" rx="8" ry="11"/><ellipse cx="246" cy="144" rx="8" ry="11"/><ellipse cx="258" cy="152" rx="8" ry="11"/>
    </g>
  </g>
  <!-- labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="214" y="112">sun</text>
    <text x="96" y="80">peanuts</text><path d="M134 86 L154 130" stroke="#111" stroke-width="2"/>
    <text x="150" y="240">leaves</text><path d="M180 222 L174 204" stroke="#111" stroke-width="2"/>
    <text x="14" y="284" font-weight="bold">soil</text>
  </g>
</svg>
