    <text x="160" y="28" font-size="22" font-weight="bold" text-anchor="middle">Pumpkins in</text>
    <text x="160" y="54" font-size="22" font-weight="bold" text-anchor="middle">Our Garden</text>
    <g font-size="21" text-anchor="end"><text x="84" y="106">Row A</text><text x="84" y="152">Row B</text><text x="84" y="198">Row C</text></g>
  </g>
  <g fill="#F6C78B" stroke="#111" stroke-width="2.5">
    <rect x="92" y="84" width="39" height="30"/>
    <rect x="92" y="130" width="180" height="30"/>
    <rect x="92" y="176" width="64" height="30"/>
