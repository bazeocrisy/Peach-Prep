<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 272" role="img" aria-labelledby="t">
  <title id="t">Bar graph titled Pumpkins in Our Garden. The bottom says number of pumpkins. Row A 3, Row B 14, Row C 5.</title>
