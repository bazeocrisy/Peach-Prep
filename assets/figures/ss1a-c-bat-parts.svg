<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
  <title id="t">Diagram of a baseball bat with three labels: knob, handle and barrel</title>
  <!-- bat, drawn on a slant from the knob (left) to the barrel (right) -->
  <g transform="rotate(-8 160 110)">
    <path d="M40 112 L150 106 Q200 96 290 94 Q306 100 290 128 Q200 126 150 116 L40 118 Z" fill="#E8C99B" stroke="#4A2E16" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="34" cy="115" rx="9" ry="13" fill="#C49A63" stroke="#4A2E16" stroke-width="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="8" y="70">knob</text><path d="M30 76 L38 108" stroke="#111" stroke-width="2"/>
    <text x="96" y="176">handle</text><path d="M126 156 L114 124" stroke="#111" stroke-width="2"/>
    <text x="216" y="40">barrel</text><path d="M244 48 L250 82" stroke="#111" stroke-width="2"/>
  </g>
</svg>
