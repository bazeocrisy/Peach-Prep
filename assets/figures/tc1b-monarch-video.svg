<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" role="img" aria-labelledby="t">
  <title id="t">A video about monarchs with a caption line under it.</title>
  <!-- screen frame -->
  <rect x="2" y="2" width="316" height="326" rx="12" fill="#FFFFFF" stroke="#444" stroke-width="3"/>
  <path d="M2 34 H318" stroke="#444" stroke-width="2"/>
  <rect x="3.5" y="3.5" width="313" height="29" rx="10" fill="#E6E6E6"/>
  <g fill="#FFFFFF" stroke="#444" stroke-width="1.5"><circle cx="20" cy="18" r="6"/><circle cx="38" cy="18" r="6"/><circle cx="56" cy="18" r="6"/></g>
  <!-- video: a monarch holding on under a leaf while rain falls -->
  <rect x="12" y="46" width="296" height="160" fill="#C9D6E0" stroke="#444" stroke-width="2"/>
  <path d="M12 82 Q120 70 308 96" fill="none" stroke="#5A3B1E" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 78 Q170 70 214 108 Q160 118 120 78 Z" fill="#5E9B45" stroke="#2F4A22" stroke-width="2"/>
  <path d="M120 78 Q170 92 214 108" fill="none" stroke="#2F4A22" stroke-width="1.5"/>
  <!-- monarch hanging under the leaf, wings folded -->
  <path d="M166 104 L166 112" stroke="#111" stroke-width="2.5"/>
  <path d="M166 112 Q138 128 146 158 Q160 152 166 136 Z" fill="#F08A1C" stroke="#111" stroke-width="2.5"/>
  <path d="M166 112 Q194 128 186 158 Q172 152 166 136 Z" fill="#F08A1C" stroke="#111" stroke-width="2.5"/>
  <path d="M166 112 L166 150" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <g fill="#FFFFFF"><circle cx="150" cy="150" r="2.2"/><circle cx="182" cy="150" r="2.2"/><circle cx="156" cy="126" r="2"/><circle cx="176" cy="126" r="2"/></g>
  <!-- rain -->
  <g stroke="#2D6A9A" stroke-width="2.5" stroke-linecap="round">
    <path d="M36 104 l-6 14"/><path d="M70 120 l-6 14"/><path d="M52 160 l-6 14"/><path d="M96 150 l-6 14"/>
    <path d="M236 128 l-6 14"/><path d="M268 110 l-6 14"/><path d="M252 168 l-6 14"/><path d="M290 150 l-6 14"/>
    <path d="M118 186 l-6 14"/><path d="M212 182 l-6 14"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <!-- caption line under the video -->
    <rect x="12" y="206" width="296" height="110" fill="#1E1E1E" stroke="#444" stroke-width="2"/>
    <text x="22" y="236" fill="#FFFFFF">[rain tapping]</text>
    <text x="22" y="268" fill="#FFFFFF">NARRATOR: They wait</text>
    <text x="22" y="298" fill="#FFFFFF">for the rain to stop.</text>
  </g>
</svg>
