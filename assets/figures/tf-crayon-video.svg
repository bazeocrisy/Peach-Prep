<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" role="img" aria-labelledby="t">
  <title id="t">A web page with a video about how crayons are made, with a progress bar, three buttons and two links</title>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <!-- tabs -->
    <rect x="12" y="8" width="92" height="38" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="58" y="35" text-anchor="middle">Home</text>
    <rect x="114" y="8" width="92" height="38" fill="#E8EEF9" stroke="#111" stroke-width="5"/><text x="160" y="35" text-anchor="middle">Crafts</text>
    <rect x="216" y="8" width="92" height="38" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="262" y="35" text-anchor="middle">Videos</text>
    <text x="12" y="82" font-weight="bold">How Crayons Are Made</text>
    <!-- video box with a play button -->
    <rect x="12" y="96" width="296" height="110" fill="#3B3B3B"/>
    <circle cx="160" cy="151" r="30" fill="#FFFFFF"/><polygon points="150,134 150,168 178,151" fill="#111"/>
    <!-- progress bar with three markers -->
    <path d="M24 232 H296" stroke="#777" stroke-width="6"/>
    <circle cx="72" cy="232" r="9" fill="#123E9C"/><circle cx="160" cy="232" r="9" fill="#123E9C"/><circle cx="248" cy="232" r="9" fill="#123E9C"/>
    <text x="72" y="268" text-anchor="middle">Melt</text><text x="160" y="268" text-anchor="middle">Color</text><text x="248" y="268" text-anchor="middle">Cool</text>
    <!-- buttons -->
    <rect x="12" y="288" width="64" height="40" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="44" y="317" text-anchor="middle" font-weight="bold">CC</text>
    <rect x="96" y="288" width="64" height="40" fill="#FFFFFF" stroke="#111" stroke-width="3"/>
    <polygon points="112,311 112,305 120,305 130,298 130,318 120,311" fill="#111"/>
    <path d="M136 303 Q142 308 136 313 M141 299 Q151 308 141 317" fill="none" stroke="#111" stroke-width="3"/>
    <rect x="180" y="288" width="64" height="40" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="212" y="317" text-anchor="middle" font-weight="bold">1x</text>
    <!-- links -->
    <text x="12" y="372" fill="#123E9C">Read the transcript</text><path d="M12 378 H206" stroke="#123E9C" stroke-width="2"/>
    <text x="12" y="410" fill="#123E9C">Make your own crayons</text><path d="M12 416 H232" stroke="#123E9C" stroke-width="2"/>
  </g>
</svg>
