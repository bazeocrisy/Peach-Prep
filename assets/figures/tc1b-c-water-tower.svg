<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-labelledby="t">
  <title id="t">Diagram of a water tower, a pump and a home, with pipes and three numbered arrows</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#123E9C"/></marker>
  </defs>
  <!-- ground -->
  <rect x="0" y="300" width="320" height="100" fill="#EADBC2"/>
  <path d="M0 300 H320" stroke="#4A3A22" stroke-width="3"/>
  <!-- tower legs and tank -->
  <g stroke="#333" stroke-width="5"><path d="M130 130 L112 300"/><path d="M210 130 L228 300"/><path d="M118 230 H222"/></g>
  <rect x="104" y="44" width="132" height="90" rx="40" fill="#DCEBF5" stroke="#111" stroke-width="3"/>
  <path d="M110 92 H230" stroke="#2D6A9A" stroke-width="2.5" stroke-dasharray="8 6"/>
  <!-- pump house -->
  <rect x="14" y="246" width="72" height="54" fill="#FFFFFF" stroke="#111" stroke-width="3"/>
  <!-- pipe 1: from the pump up into the tank -->
  <path d="M86 280 H150 V134" fill="none" stroke="#555" stroke-width="9"/>
  <path d="M150 230 V160" stroke="#123E9C" stroke-width="4" marker-end="url(#a)"/>
  <!-- pipe 2: from the tank down and under the ground -->
  <path d="M192 134 V342 H250" fill="none" stroke="#555" stroke-width="9"/>
  <path d="M192 170 V250" stroke="#123E9C" stroke-width="4" marker-end="url(#a)"/>
  <!-- pipe 3: under the ground into the home -->
  <path d="M250 342 H272 V286" fill="none" stroke="#555" stroke-width="9"/>
  <path d="M206 330 H250" stroke="#123E9C" stroke-width="4" marker-end="url(#a)"/>
  <!-- home -->
  <path d="M244 300 V250 L278 222 L312 250 V300 Z" fill="#FFFFFF" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <!-- numbered circles on the arrows -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#111" text-anchor="middle">
    <circle cx="170" cy="200" r="15" fill="#FFFFFF" stroke="#111" stroke-width="2.5"/><text x="170" y="207">1</text>
    <circle cx="214" cy="212" r="15" fill="#FFFFFF" stroke="#111" stroke-width="2.5"/><text x="214" y="219">2</text>
    <circle cx="226" cy="372" r="15" fill="#FFFFFF" stroke="#111" stroke-width="2.5"/><text x="226" y="379">3</text>
  </g>
  <!-- labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="146" y="32">tank</text>
    <text x="18" y="236">pump</text>
    <text x="250" y="212">home</text>
    <text x="14" y="352">pipe</text><path d="M62 346 L146 290" stroke="#111" stroke-width="2"/>
  </g>
</svg>
