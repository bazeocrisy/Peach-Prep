<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 318" role="img" aria-labelledby="t">
  <title id="t">Bar graph titled Hours of Daylight on the Tundra. The bottom says hours. September 12, October 9, November 5, December 3.</title>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="160" y="28" font-size="22" font-weight="bold" text-anchor="middle">Hours of Daylight</text>
    <text x="160" y="54" font-size="22" font-weight="bold" text-anchor="middle">on the Tundra</text>
    <g font-size="21" text-anchor="end"><text x="84" y="106">Sep</text><text x="84" y="152">Oct</text><text x="84" y="198">Nov</text><text x="84" y="244">Dec</text></g>
  </g>
  <g fill="#BFD9F2" stroke="#111" stroke-width="2.5">
    <rect x="92" y="84" width="180" height="30"/>
    <rect x="92" y="130" width="135" height="30"/>
    <rect x="92" y="176" width="75" height="30"/>
    <rect x="92" y="222" width="45" height="30"/>
  </g>
  <path d="M92 74 V262 H302" fill="none" stroke="#111" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#111">
    <text x="280" y="106">12</text>
    <text x="235" y="152">9</text>
    <text x="175" y="198">5</text>
    <text x="145" y="244">3</text>
    <text x="196" y="294" text-anchor="middle">hours</text>
  </g>
</svg>
