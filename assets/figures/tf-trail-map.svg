<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 484" role="img" aria-labelledby="t">
  <title id="t">Map of the Fern Hollow Nature Trail with a compass arrow and a key for the parking lot, picnic tables, bird tower and footbridge</title>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker>
  </defs>
  <rect x="16" y="16" width="288" height="304" fill="#F3F7EC" stroke="#111" stroke-width="3"/>
  <!-- pond -->
  <ellipse cx="160" cy="160" rx="62" ry="42" fill="#CFE3F5" stroke="#123E9C" stroke-width="3"/>
  <!-- trail loop -->
  <path d="M60 282 V60 H252 V234 H60 Z" fill="none" stroke="#123E9C" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round"/>
  <!-- parking lot (circle with P) south-west -->
  <circle cx="60" cy="282" r="16" fill="#FFFFFF" stroke="#111" stroke-width="4"/>
  <!-- picnic tables (square) due west of the pond -->
  <rect x="46" y="146" width="28" height="28" fill="#111"/>
  <!-- bird tower (triangle) north-east -->
  <polygon points="252,34 272,68 232,68" fill="#111"/>
  <!-- footbridge (wide bar) south-east -->
  <rect x="236" y="226" width="32" height="16" fill="#FFFFFF" stroke="#111" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="160" y="168" text-anchor="middle" font-weight="bold">Pond</text>
    <text x="60" y="290" text-anchor="middle" font-weight="bold">P</text>
    <text x="286" y="40" text-anchor="middle" font-weight="bold">N</text>
  </g>
  <path d="M286 112 V50" stroke="#111" stroke-width="3" marker-end="url(#n)"/>
  <!-- key -->
  <rect x="16" y="330" width="288" height="144" fill="#FFFFFF" stroke="#444" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <circle cx="38" cy="350" r="10" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="66" y="358">parking lot</text>
    <rect x="27" y="366" width="22" height="22" fill="#111"/><text x="66" y="385">picnic tables</text>
    <polygon points="38,396 51,416 25,416" fill="#111"/><text x="66" y="414">bird tower</text>
    <rect x="24" y="428" width="28" height="14" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="66" y="442">bridge</text>
    <path d="M24 458 H52" stroke="#123E9C" stroke-width="4" stroke-dasharray="8 5"/><text x="66" y="466">trail</text>
  </g>
</svg>
