<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-labelledby="t">
  <title id="t">The parts of a hot-air balloon, with four labels. The label vent points to a small dashed circle at the very top of the balloon. The label envelope points to the big balloon. The label burner points to a small box under the balloon, with a flame pointing up. The label basket points to the basket that hangs from ropes at the bottom.</title>
  <!-- envelope -->
  <path d="M130 40 C190 40 215 80 215 120 C215 165 170 200 145 225 L115 225 C90 200 45 165 45 120 C45 80 70 40 130 40 Z" fill="#F4E3B5" stroke="#111" stroke-width="3"/>
  <g fill="none" stroke="#111" stroke-width="1.8">
    <path d="M130 40 Q98 130 120 225"/><path d="M130 40 Q162 130 140 225"/>
    <path d="M118 41 Q55 120 115 225"/><path d="M142 41 Q205 120 145 225"/>
  </g>
  <!-- vent at the crown -->
  <ellipse cx="130" cy="47" rx="22" ry="7" fill="#fff" stroke="#111" stroke-width="2.5" stroke-dasharray="5 3"/>
  <!-- flame and burner -->
  <path d="M130 200 C122 212 122 222 130 232 C138 222 138 212 130 200 Z" fill="#F2A33A" stroke="#111" stroke-width="2"/>
  <rect x="117" y="232" width="26" height="14" fill="#9AA5B1" stroke="#111" stroke-width="2.5"/>
  <!-- ropes and basket -->
  <g stroke="#111" stroke-width="2"><path d="M115 225 L106 280"/><path d="M145 225 L154 280"/></g>
  <rect x="104" y="280" width="52" height="40" fill="#D9B37C" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="1.5"><path d="M104 293 H156 M104 306 H156 M117 280 V320 M130 280 V320 M143 280 V320"/></g>
  <!-- labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="198" y="28">vent</text><path d="M196 24 L153 44" stroke="#111" stroke-width="2"/>
    <text x="214" y="184">envelope</text><path d="M212 178 L186 178" stroke="#111" stroke-width="2"/>
    <text x="14" y="246">burner</text><path d="M86 240 L114 240" stroke="#111" stroke-width="2"/>
    <text x="14" y="308">basket</text><path d="M84 302 L102 302" stroke="#111" stroke-width="2"/>
  </g>
</svg>
