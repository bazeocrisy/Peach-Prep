<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" role="img" aria-labelledby="t">
  <title id="t">Diagram of a swimming pool seen from above, with three labels: backstroke flags, lane line and line on the bottom</title>
  <defs>
    <pattern id="w" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#DCEBF5"/><path d="M0 8 Q6 4 12 8 T24 8" fill="none" stroke="#9CC3DE" stroke-width="1.5"/></pattern>
  </defs>
  <!-- pool -->
  <rect x="40" y="56" width="240" height="300" fill="url(#w)" stroke="#111" stroke-width="4"/>
  <!-- lane lines: ropes with floats -->
  <g fill="#FFFFFF" stroke="#111" stroke-width="2">
    <path d="M120 56 V356" stroke-width="2"/><path d="M200 56 V356" stroke-width="2"/>
  </g>
  <g fill="#FFFFFF" stroke="#111" stroke-width="2">
    <circle cx="120" cy="76" r="5"/><circle cx="120" cy="106" r="5"/><circle cx="120" cy="136" r="5"/><circle cx="120" cy="166" r="5"/><circle cx="120" cy="196" r="5"/><circle cx="120" cy="226" r="5"/><circle cx="120" cy="256" r="5"/><circle cx="120" cy="286" r="5"/><circle cx="120" cy="316" r="5"/><circle cx="120" cy="346" r="5"/>
    <circle cx="200" cy="76" r="5"/><circle cx="200" cy="106" r="5"/><circle cx="200" cy="136" r="5"/><circle cx="200" cy="166" r="5"/><circle cx="200" cy="196" r="5"/><circle cx="200" cy="226" r="5"/><circle cx="200" cy="256" r="5"/><circle cx="200" cy="286" r="5"/><circle cx="200" cy="316" r="5"/><circle cx="200" cy="346" r="5"/>
  </g>
  <!-- dark line on the bottom of each lane, ending in a T near each wall -->
  <g stroke="#1E1E1E" stroke-width="6" stroke-linecap="butt">
    <path d="M80 82 V330 M66 82 H94 M66 330 H94"/>
    <path d="M160 82 V330 M146 82 H174 M146 330 H174"/>
    <path d="M240 82 V330 M226 82 H254 M226 330 H254"/>
  </g>
  <!-- backstroke flags near each end -->
  <g stroke="#111" stroke-width="2"><path d="M30 112 H290"/><path d="M30 300 H290"/></g>
  <g fill="#FFFFFF" stroke="#111" stroke-width="2">
    <path d="M52 112 l8 14 l8 -14 Z"/><path d="M84 112 l8 14 l8 -14 Z"/><path d="M132 112 l8 14 l8 -14 Z"/><path d="M164 112 l8 14 l8 -14 Z"/><path d="M212 112 l8 14 l8 -14 Z"/><path d="M244 112 l8 14 l8 -14 Z"/>
    <path d="M52 300 l8 14 l8 -14 Z"/><path d="M84 300 l8 14 l8 -14 Z"/><path d="M132 300 l8 14 l8 -14 Z"/><path d="M164 300 l8 14 l8 -14 Z"/><path d="M212 300 l8 14 l8 -14 Z"/><path d="M244 300 l8 14 l8 -14 Z"/>
  </g>
  <!-- labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="160" y="32" text-anchor="middle">backstroke flags</text><path d="M160 38 L174 108" stroke="#111" stroke-width="2"/>
    <text x="196" y="392">lane line</text><path d="M232 374 L204 330" stroke="#111" stroke-width="2"/>
    <text x="8" y="420">line on the bottom</text><path d="M60 400 L78 336" stroke="#111" stroke-width="2"/>
  </g>
</svg>
