<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-labelledby="t">
  <title id="t">Diagram of a peanut plant with four labels: flower, peg, peanut and soil</title>
  <!-- soil -->
  <rect x="0" y="190" width="320" height="150" fill="#EADBC2"/>
  <path d="M0 190 H320" stroke="#4A3A22" stroke-width="3"/>
  <g fill="#4A3A22"><circle cx="30" cy="230" r="2"/><circle cx="90" cy="300" r="2"/><circle cx="280" cy="222" r="2"/><circle cx="250" cy="318" r="2"/><circle cx="150" cy="320" r="2"/></g>
  <!-- main stem and leaves -->
  <path d="M110 190 V86" stroke="#2F5A2A" stroke-width="7"/>
  <path d="M110 160 Q72 132 46 152 Q74 178 110 160 Z" fill="#CFE8C4" stroke="#2F5A2A" stroke-width="2.5"/>
  <path d="M110 128 Q70 98 46 116 Q74 146 110 128 Z" fill="#CFE8C4" stroke="#2F5A2A" stroke-width="2.5"/>
  <path d="M110 112 Q146 84 172 102 Q146 128 110 112 Z" fill="#CFE8C4" stroke="#2F5A2A" stroke-width="2.5"/>
  <!-- small flower at the top -->
  <g fill="#FFF3B0" stroke="#111" stroke-width="2.5">
    <circle cx="110" cy="58" r="11"/><circle cx="94" cy="72" r="11"/><circle cx="126" cy="72" r="11"/><circle cx="110" cy="84" r="9"/>
  </g>
  <circle cx="110" cy="72" r="8" fill="#E9C46A" stroke="#111" stroke-width="2"/>
  <!-- the peg: a thin stem that bends down into the soil -->
  <path d="M112 150 Q176 150 190 196 Q198 226 200 250" fill="none" stroke="#2F5A2A" stroke-width="4" stroke-linecap="round"/>
  <!-- the peanut at the end of the peg, under the soil -->
  <g fill="#D9B27C" stroke="#4A2E16" stroke-width="2.5">
    <ellipse cx="200" cy="262" rx="14" ry="18"/><ellipse cx="200" cy="292" rx="14" ry="17"/>
  </g>
  <path d="M188 277 H212" stroke="#4A2E16" stroke-width="2"/>
  <!-- labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="160" y="44">flower</text><path d="M158 48 L124 62" stroke="#111" stroke-width="2"/>
    <text x="232" y="152">peg</text><path d="M230 148 L186 168" stroke="#111" stroke-width="2"/>
    <text x="236" y="284">peanut</text><path d="M234 278 L216 276" stroke="#111" stroke-width="2"/>
    <text x="14" y="326" font-weight="bold">soil</text>
  </g>
</svg>
