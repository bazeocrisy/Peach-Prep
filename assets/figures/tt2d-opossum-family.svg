  <path d="M236 122 C282 118 300 138 296 160 C294 168 284 168 284 160" fill="none" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <rect x="92" y="138" width="16" height="30" rx="7" fill="#d0d0d0" stroke="#333" stroke-width="3"/>
  <rect x="204" y="138" width="16" height="30" rx="7" fill="#d0d0d0" stroke="#333" stroke-width="3"/>
  <ellipse cx="160" cy="118" rx="84" ry="38" fill="#e4e4e4" stroke="#333" stroke-width="3"/>
  <polygon points="88,98 30,124 90,140" fill="#f2f2f2" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
