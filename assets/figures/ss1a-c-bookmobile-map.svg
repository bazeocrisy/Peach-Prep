<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="t">
  <title id="t">Map of Pine County with a key for the library building, bookmobile stops and the bookmobile route</title>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker>
  </defs>
  <!-- county outline -->
  <polygon points="48,30 304,30 304,300 16,300 16,70" fill="#F3F7EC" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <!-- north arrow -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111"><text x="22" y="22" font-weight="bold">N</text></g>
  <path d="M30 64 V30" stroke="#111" stroke-width="3" marker-end="url(#n)"/>
  <!-- bookmobile route: dashed lines from town out to each stop -->
  <g fill="none" stroke="#123E9C" stroke-width="3.5" stroke-dasharray="10 7">
    <path d="M160 168 L66 84"/><path d="M160 168 L270 72"/><path d="M160 168 L52 262"/><path d="M160 168 L278 262"/>
  </g>
  <!-- library building in Millbrook -->
  <rect x="148" y="156" width="24" height="24" fill="#111"/>
  <!-- bookmobile stops -->
  <g fill="#FFFFFF" stroke="#111" stroke-width="3.5">
    <circle cx="66" cy="84" r="10"/><circle cx="270" cy="72" r="10"/><circle cx="52" cy="262" r="10"/><circle cx="278" cy="262" r="10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="160" y="58" font-weight="bold" text-anchor="middle">PINE COUNTY</text>
    <text x="160" y="210" text-anchor="middle" stroke="#F3F7EC" stroke-width="7" paint-order="stroke">Millbrook</text>
  </g>
  <!-- key and scale -->
  <rect x="16" y="314" width="288" height="100" fill="#FFFFFF" stroke="#444" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#111">
    <rect x="28" y="324" width="18" height="18" fill="#111"/><text x="56" y="341">library building</text>
    <circle cx="37" cy="361" r="9" fill="#FFFFFF" stroke="#111" stroke-width="3"/><text x="56" y="368">bookmobile stop</text>
    <path d="M24 392 H50" stroke="#123E9C" stroke-width="3.5" stroke-dasharray="8 5"/><text x="56" y="399">route</text>
    <path d="M140 392 H200" stroke="#111" stroke-width="5"/><path d="M140 384 V400 M200 384 V400" stroke="#111" stroke-width="2.5"/>
    <text x="210" y="399">5 miles</text>
  </g>
</svg>
