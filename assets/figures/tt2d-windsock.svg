<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="t">
  <title id="t">Drawing of a windsock on a tall pole. The cloth cone points to the right. Labels point to the pole, the wide end of the cone, and the narrow end of the cone.</title>
  <rect width="320" height="260" fill="#fff"/>
  <line x1="70" y1="40" x2="70" y2="250" stroke="#333" stroke-width="6"/>
  <ellipse cx="92" cy="80" rx="10" ry="30" fill="#fff" stroke="#333" stroke-width="4"/>
  <path d="M92 50 L250 68 L250 92 L92 110 Z" fill="#e4e4e4" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <path d="M140 56 L140 104 M190 62 L190 98" stroke="#333" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">
    <text x="84" y="170">pole</text><path d="M72 160 L72 150" stroke="#111" stroke-width="2"/>
    <text x="100" y="30">wide end</text><path d="M110 36 L96 56" stroke="#111" stroke-width="2"/><circle cx="95" cy="58" r="3.5"/>
