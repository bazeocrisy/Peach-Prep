<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-labelledby="t">
  <title id="t">The life cycle of a monarch: 1 egg, 2 caterpillar, 3 chrysalis, 4 butterfly, with arrows going around in a circle</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs>
  <g fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)">
    <path d="M205 46 Q250 60 262 118"/>
    <path d="M250 222 Q240 268 200 282"/>
    <path d="M120 296 Q40 300 34 246"/>
    <path d="M58 112 Q72 56 112 46"/>
  </g>
  <!-- 1 egg on a leaf -->
  <path d="M120 44 Q160 8 200 44 Q160 72 120 44 Z" fill="#DCEFD3" stroke="#2F5A2A" stroke-width="2.5"/>
  <ellipse cx="160" cy="38" rx="7" ry="10" fill="#FFFBEA" stroke="#111" stroke-width="2"/>
  <!-- 2 caterpillar: striped segments -->
  <g fill="#FFF3C4" stroke="#111" stroke-width="2">
    <circle cx="214" cy="158" r="10"/><circle cx="231" cy="156" r="10"/><circle cx="248" cy="154" r="10"/><circle cx="265" cy="156" r="10"/><circle cx="282" cy="158" r="10"/>
    <circle cx="299" cy="152" r="11"/>
  </g>
  <g stroke="#111" stroke-width="3"><path d="M214 148 v20 M231 146 v20 M248 144 v20 M265 146 v20 M282 148 v20"/></g>
  <path d="M302 141 l4 -12 M296 141 l-4 -12" stroke="#111" stroke-width="2"/>
  <!-- 3 chrysalis hanging from a twig -->
  <path d="M128 228 H192" stroke="#4A2E16" stroke-width="4"/><path d="M160 228 V238" stroke="#111" stroke-width="2"/>
  <path d="M160 238 Q180 252 172 276 Q160 294 148 276 Q140 252 160 238 Z" fill="#D6EFD8" stroke="#111" stroke-width="2.5"/>
  <path d="M148 254 Q160 260 172 254" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- 4 butterfly -->
  <g stroke="#111" stroke-width="2.5" fill="#F4A340">
    <path d="M60 162 Q30 120 18 140 Q14 168 60 168 Z"/><path d="M68 162 Q98 120 110 140 Q114 168 68 168 Z"/>
    <path d="M60 170 Q28 176 34 198 Q50 206 62 176 Z"/><path d="M68 170 Q100 176 94 198 Q78 206 66 176 Z"/>
  </g>
  <g fill="#fff"><circle cx="30" cy="148" r="3"/><circle cx="98" cy="148" r="3"/><circle cx="40" cy="192" r="3"/><circle cx="88" cy="192" r="3"/></g>
  <path d="M64 150 V198" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <path d="M63 150 l-8 -16 M65 150 l8 -16" stroke="#111" stroke-width="2"/>
  <!-- labels with stage numbers -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111" text-anchor="middle">
    <text x="160" y="96">1 egg</text>
    <text x="252" y="200">2 caterpillar</text>
    <text x="160" y="322">3 chrysalis</text>
    <text x="64" y="230">4 butterfly</text>
  </g>
</svg>
